name: Daily Prothom Alo ePaper EPUB

on:
  schedule:
    # 01:00 UTC = 07:00 AM BST (Bangladesh Standard Time, UTC+6)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from UI anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright system dependencies & Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run ePaper Scraper & EPUB Compiler
        run: python build_epaper.py

      - name: Upload Daily EPUB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prothom-Alo-ePaper-${{ github.run_id }}
          path: prothom_alo_epaper_*.epub
          retention-days: 14
