name: Daily Prothom Alo EPUB

on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 7:00 AM BST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generation script
        run: python build_epaper.py

      - name: Upload generated EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prothom-Alo-EPUB-${{ github.run_id }}
          path: prothom_alo_*.epub
          retention-days: 7
