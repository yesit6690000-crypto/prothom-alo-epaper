name: Daily Prothom Alo ePaper

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run ePaper Scraper
        env:
          EPAPER_COOKIE_JSON: ${{ secrets.EPAPER_COOKIE_JSON }}
        run: python build_epaper.py

      - name: Upload EPUB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prothom-Alo-ePaper-${{ github.run_id }}
          path: prothom_alo_epaper_*.epub
          retention-days: 7
