name: Daily Prothom Alo Print EPUB

on:
  schedule:
    # 01:00 UTC = 07:00 AM BST (UTC+6)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Print Edition EPUB
        run: python build_epaper.py

      - name: Upload Daily EPUB
        uses: actions/upload-artifact@v4
        with:
          name: Prothom-Alo-EPUB-${{ github.run_id }}
          path: prothom_alo_print_*.epub
          retention-days: 7
